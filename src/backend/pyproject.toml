[project]
name = "fitness-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.5",
    "langchain-anthropic>=1.7.6",
    "langchain-core>=1.6.12",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
